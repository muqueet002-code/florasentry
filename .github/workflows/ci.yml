# FloraSentry V2 - CI (TRD 35.1)
#
# Phase 1 scope: a reliable validation pipeline. No deployment stage yet - that lands
# with the deployment work in Phase 10, once a hosting decision exists (TRD D18).

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-latest

    services:
      postgres:
        # Must be a PostGIS image: the schema uses geometry columns and spatial
        # indexes, so a plain postgres service would fail the migration.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: florasentry
          POSTGRES_PASSWORD: florasentry
          POSTGRES_DB: florasentry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U florasentry -d florasentry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: ci
      # CI-only value. Real secrets never live in a workflow file.
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      DATABASE_URL: postgresql+psycopg://florasentry:florasentry@localhost:5432/florasentry_test
      TEST_DATABASE_URL: postgresql+psycopg://florasentry:florasentry@localhost:5432/florasentry_test
      CORS_ALLOWED_ORIGINS: http://localhost:5173

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        # Non-blocking in Phase 1; make this blocking once the codebase is clean.
        run: mypy app/ || true

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Verify migrations are reversible
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Verify ORM matches migrations (no schema drift)
        run: alembic check

      - name: Seed reference data
        run: python scripts/seed_reference_data.py

      - name: Tests (unit + API + integration)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Tests (vitest)
        # Includes the translation-completeness check, so a missing hi/mr key
        # fails the build rather than shipping an untranslated screen.
        run: npm test

      - name: Build
        run: npm run build

  secrets-scan:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure no .env file is committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|demo)$'; then
            echo "ERROR: an environment file is committed. Remove it and rotate the values."
            exit 1
          fi
          echo "OK: no committed .env files"

      - name: Ensure the example secret is not used as a real value
        run: |
          if git grep -n "JWT_SECRET=" -- ':!*.example' ':!.github' | grep -v '^\s*$'; then
            echo "ERROR: JWT_SECRET assigned outside .env.example"
            exit 1
          fi
          echo "OK: no JWT_SECRET assignments outside .env.example"
