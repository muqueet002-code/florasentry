[project]
name = "florasentry-backend"
version = "0.1.0"
description = "FloraSentry V2 backend - crop health decision support (SIH26131, Team ASTRIX S83)"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "geoalchemy2>=0.15",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "python-multipart>=0.0.12",
    "shapely>=2.0",
    "pillow>=10.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Torch is NOT a base dependency: it is ~2GB and is only needed once real model
# weights exist. The runner imports it lazily, so the application starts and reports
# AI_MODEL_UNAVAILABLE honestly when torch (or the artifact) is absent.
ai = [
    "torch>=2.4",
    "torchvision>=0.19",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is the documented idiom

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
# Phase 1: non-blocking. Tighten per TRD 35.1 once the codebase is clean.
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live PostgreSQL/PostGIS database",
]
filterwarnings = ["ignore::DeprecationWarning"]
