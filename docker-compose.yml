# FloraSentry V2 - development environment (TRD 35.4, 37.2)
#
# One `docker compose up` brings up the whole system. A demo that needs a multi-step
# deployment is a demo that fails at the wrong moment.
#
# Startup order is enforced by healthchecks: db -> migrate -> backend/worker -> frontend.

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: florasentry-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-florasentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-florasentry}
      POSTGRES_DB: ${POSTGRES_DB:-florasentry}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - florasentry_db_data:/var/lib/postgresql/data
    healthcheck:
      # Readiness plus a real query, so dependents never start against a
      # still-initialising server.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-florasentry} -d ${POSTGRES_DB:-florasentry} && psql -U ${POSTGRES_USER:-florasentry} -d ${POSTGRES_DB:-florasentry} -c 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: florasentry-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-florasentry}:${POSTGRES_PASSWORD:-florasentry}@db:5432/${POSTGRES_DB:-florasentry}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-any-real-deployment}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: florasentry-backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-console}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-florasentry}:${POSTGRES_PASSWORD:-florasentry}@db:5432/${POSTGRES_DB:-florasentry}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-any-real-deployment}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/srv/app/app:ro
      - florasentry_media:/var/florasentry/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Worker foundation (TRD 4.2): same image, different entrypoint. Phase 1 registers
  # no scheduled jobs, so this service is OFF by default and starts only with
  # `--profile worker`. It is here so later phases add a job, not infrastructure.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: florasentry-worker
    command: ["python", "-m", "app.workers.scheduler"]
    profiles: ["worker"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-florasentry}:${POSTGRES_PASSWORD:-florasentry}@db:5432/${POSTGRES_DB:-florasentry}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-any-real-deployment}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: florasentry-frontend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_APP_ENV: ${APP_ENV:-local}
      # Base map tiles. OpenStreetMap's standard tile server, used within its public
      # tile usage policy (low-volume demo/development) and with the attribution it
      # requires. Override both values to switch provider - no code change needed.
      VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      VITE_MAP_ATTRIBUTION: ${VITE_MAP_ATTRIBUTION:-© OpenStreetMap contributors}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/srv/app/src
      - ./frontend/public:/srv/app/public
      - ./frontend/index.html:/srv/app/index.html
    depends_on:
      - backend

volumes:
  florasentry_db_data:
  florasentry_media:
